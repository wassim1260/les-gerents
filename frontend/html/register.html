<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - HTM Transport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 0;
        }
        .register-card {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="register-card mx-auto">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill" style="font-size: 3rem; color: #667eea;"></i>
                    <h2 class="fw-bold mt-2">Inscription</h2>
                    <p class="text-muted">Créez votre compte client</p>
                </div>

                <form id="registerForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Prénom</label>
                            <input type="text" class="form-control" placeholder="Prénom" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Nom</label>
                            <input type="text" class="form-control" placeholder="Nom" required>
                        </div>
                    </div>

                    <div class="mb-3 mt-3">
                        <label class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" placeholder="votre@email.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Téléphone</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-phone"></i></span>
                            <input type="tel" class="form-control" placeholder="+212 6XX-XXXXXX" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Ville</label>
                        <select class="form-select" required>
                            <option value="">Choisir votre ville</option>
                            <option>Casablanca</option>
                            <option>Rabat</option>
                            <option>Tanger</option>
                            <option>Marrakech</option>
                            <option>Agadir</option>
                            <option>Al Hoceima</option>
                            <option>Dakhla</option>
                            <option>Nador</option>
                            <option>Fès</option>
                            <option>Ouarzazate</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mot de passe</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" placeholder="••••••••" required minlength="8">
                        </div>
                        <small class="text-muted">Minimum 8 caractères</small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirmer le mot de passe</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" placeholder="••••••••" required minlength="8">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nom de l'entreprise (optionnel)</label>
                        <input type="text" class="form-control" placeholder="Nom de votre entreprise">
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="acceptTerms" required>
                        <label class="form-check-label" for="acceptTerms">
                            J'accepte les <a href="#">conditions d'utilisation</a> et la <a href="#">politique de confidentialité</a>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                        <i class="bi bi-person-plus"></i> Créer mon compte
                    </button>

                    <hr>

                    <div class="text-center">
                        <p class="mb-2">Vous avez déjà un compte ?</p>
                        <a href="login.html" class="btn btn-outline-primary w-100">
                            <i class="bi bi-box-arrow-in-right"></i> Se Connecter
                        </a>
                    </div>

                    <hr>

                    <div class="text-center">
                        <a href="index.html" class="text-decoration-none">
                            <i class="bi bi-arrow-left"></i> Retour à l'accueil
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Handle registration
            alert('Inscription réussie ! Vous pouvez maintenant vous connecter.');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
