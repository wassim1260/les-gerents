version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: hotel_transport_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: hotel_transport
      MYSQL_USER: hotel_user
      MYSQL_PASSWORD: hotel_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - hotel_network

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: hotel_transport_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: mongo_pass
      MONGO_INITDB_DATABASE: hotel_transport_logs
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - hotel_network

  # PHP Apache for legacy PHP scripts
  php_apache:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: hotel_transport_php
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./backend/php:/var/www/html
    depends_on:
      - mysql
    networks:
      - hotel_network

  # Laravel Backend API
  laravel:
    build:
      context: ./docker/laravel
      dockerfile: Dockerfile
    container_name: hotel_transport_laravel
    restart: always
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    volumes:
      - ./backend/laravel:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: hotel_transport
      DB_USERNAME: hotel_user
      DB_PASSWORD: hotel_pass
    depends_on:
      - mysql
      - mongodb
    command: php artisan serve --host=0.0.0.0 --port=8000
    networks:
      - hotel_network

  # Node.js/Express Backend API
  nodejs:
    build:
      context: ./docker/nodejs
      dockerfile: Dockerfile
    container_name: hotel_transport_nodejs
    restart: always
    working_dir: /app
    ports:
      - "3001:3001"
    volumes:
      - ./backend/nodejs:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo_admin:mongo_pass@mongodb:27017/hotel_transport_logs?authSource=admin
      MYSQL_HOST: mysql
      MYSQL_USER: hotel_user
      MYSQL_PASSWORD: hotel_pass
      MYSQL_DATABASE: hotel_transport
    depends_on:
      - mysql
      - mongodb
    command: npm run dev
    networks:
      - hotel_network

  # React Frontend (Client Portal)
  react_client:
    build:
      context: ./docker/react
      dockerfile: Dockerfile
    container_name: hotel_transport_react
    restart: always
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/react-client:/app
      - /app/node_modules
    environment:
      REACT_APP_API_URL: http://localhost:8000/api
      REACT_APP_NODE_API_URL: http://localhost:3001/api
      REACT_APP_WS_URL: ws://localhost:3001
    stdin_open: true
    tty: true
    command: npm start
    networks:
      - hotel_network

  # Angular Frontend (Driver Portal)
  angular_driver:
    build:
      context: ./docker/angular
      dockerfile: Dockerfile
    container_name: hotel_transport_angular
    restart: always
    working_dir: /app
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/angular-driver:/app
      - /app/node_modules
    environment:
      API_URL: http://localhost:8000/api
      NODE_API_URL: http://localhost:3001/api
      WS_URL: ws://localhost:3001
    command: npm start
    networks:
      - hotel_network

  # Next.js Frontend (Admin Portal)
  nextjs_admin:
    build:
      context: ./docker/nextjs
      dockerfile: Dockerfile
    container_name: hotel_transport_nextjs
    restart: always
    working_dir: /app
    ports:
      - "3002:3000"
    volumes:
      - ./frontend/nextjs-admin:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_NODE_API_URL: http://localhost:3001/api
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    command: npm run dev
    networks:
      - hotel_network

  # N8N Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: hotel_transport_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: admin123
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Africa/Casablanca
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - hotel_network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: hotel_transport_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hotel_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: hotel_transport_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./frontend/html:/usr/share/nginx/html
    depends_on:
      - php_apache
      - laravel
      - nodejs
      - react_client
      - angular_driver
      - nextjs_admin
    networks:
      - hotel_network

volumes:
  mysql_data:
  mongodb_data:
  n8n_data:
  redis_data:

networks:
  hotel_network:
    driver: bridge
